<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f5ecd9">
  <meta name="description" content="Drag-and-drop peer-to-peer file sharing — each file gets its own private link.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FileBeam">

  <title>FileBeam · Drag-and-Drop P2P File Sharing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- PeerJS: WebRTC wrapper with a free public broker for signaling.
       After a connection opens, all file traffic flows directly P2P. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
          crossorigin="anonymous" defer></script>
</head>
<body>

  <div class="app">

    <header class="header">
      <h1 class="header__title">FileBeam</h1>
      <p class="header__subtitle">Drag-and-Drop P2P File Sharing</p>
    </header>

    <main class="main">

      <!-- ── Share mode (default) ──────────────────────────── -->
      <section class="screen" id="screen-share" hidden>
        <div class="card">
          <p class="status status--neutral" id="shareStatus">Connecting to broker…</p>

          <p class="label">Add a file</p>
          <label class="dropzone" id="dropzone" for="filePicker">
            <input type="file" id="filePicker" hidden>
            <span class="dropzone__main">Tap to pick a file <span class="dropzone__sep">or drag &amp; drop here</span></span>
            <span class="dropzone__hint">Each file gets its own private link.</span>
          </label>

          <!-- Staging: shown after a file is dropped, before sharing -->
          <div class="file-info" id="stageInfo" hidden>
            <div class="file-info__row">
              <span class="file-info__name" id="stageName">—</span>
              <span class="file-info__size" id="stageSize">—</span>
            </div>
            <div class="file-info__row">
              <span class="badge" id="stageBadge">checking…</span>
            </div>

            <label class="toggle">
              <input type="checkbox" id="stageCompress">
              <span class="toggle__track"><span class="toggle__thumb"></span></span>
              <span class="toggle__text">Compress with gzip before sharing</span>
            </label>
            <p class="field-hint" id="stageHint">Detecting…</p>

            <div class="btn-row">
              <button class="btn btn--primary" id="btnStage">Share this file</button>
              <button class="btn btn--ghost" id="btnStageCancel">Cancel</button>
            </div>
          </div>

          <p class="label">Shared files</p>
          <div class="recv-list" id="sharedList">
            <p class="empty" id="sharedEmpty">No files shared yet.</p>
          </div>

          <div class="btn-row">
            <button class="btn btn--ghost" id="btnStopAll">Stop sharing &amp; close room</button>
          </div>
        </div>
      </section>

      <!-- ── Receive mode (URL has #share=…) ───────────────── -->
      <section class="screen" id="screen-receive" hidden>
        <div class="card">
          <h2 class="card__title">Incoming file</h2>
          <p class="status" id="recvStatus">Connecting…</p>

          <div class="file-info" id="recvInfo" hidden>
            <div class="file-info__row">
              <span class="file-info__name" id="recvName">—</span>
              <span class="file-info__size" id="recvSize">—</span>
            </div>
            <div class="file-info__row">
              <span class="badge" id="recvBadge"></span>
            </div>
            <div class="progress">
              <div class="progress__bar"><div class="progress__fill" id="recvFill"></div></div>
              <p class="progress__text" id="recvText">0%</p>
            </div>
          </div>

          <div class="btn-row" id="recvActions">
            <button class="btn btn--ghost" id="btnRecvCancel">Cancel</button>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>v0.2.0 &nbsp;·&nbsp; PeerJS WebRTC</p>
      <p>Made by <span class="footer__author">ricardobertolin</span></p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
